# Routage des modèles LLM par tâche (passerelle OpenAI-compatible).
# La base_url est injectée via secret/variable GitHub (AI_GATEWAY_BASE_URL),
# la clé via AI_GATEWAY_API_KEY. Les identifiants de modèles sont remplacés
# lors du branchement de la passerelle (DeepSeek v4.1 Flash / v4 Pro, Gemini 3 Flash).

models:
  exercise_generation:
    model: "deepseek-v4.1-flash"     # génération d'exercice
    temperature: 0.7
    max_tokens: 2048
  evaluation:
    model: "deepseek-v4-pro"         # évaluation multidimensionnelle
    temperature: 0.2
    max_tokens: 4096
  socratic_feynman:
    model: "gemini-3-flash"          # session socratique/Feynman (différé)
    temperature: 0.6
    max_tokens: 2048
  interview:
    model: "deepseek-v4-pro"         # entretien simulé (différé)
    temperature: 0.5
    max_tokens: 4096
  activity_analysis:
    model: "deepseek-v4.1-flash"     # analyse WakaTime/ActivityWatch (différé)
    temperature: 0.3
    max_tokens: 1024

# Réglages OpenClaw (agent sur VPS OCI, piloté via Telegram) — différé, complété après le MVP.
openclaw:
  enabled: false
  control_channel: telegram
  host: ""
