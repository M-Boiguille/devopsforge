# Répétition espacée — algorithme SM-2 (SuperMemo 2), adapté à une maîtrise
# multidimensionnelle (7 dimensions bornées [0,1]).
#
# ⚠️ Remplace l'ancienne courbe d'Ebbinghaus (rate: 0.30 / threshold: 0.80).
# Cette formule était mathématiquement morte :
#   jours = ln(score / 0.80) / 0.30  →  maximum 0.744 jour pour tout score <= 1.0
# donc `due_at = last_reviewed + 1` pour TOUTES les notions, sans exception.
#
# Nouvelle règle : la qualité de récupération (0..5) est déduite de la maîtrise
# réelle, puis l'intervalle suit SM-2 (1, 6, puis × EF).

spaced_repetition:
  min_score_per_dimension: 0.85
  min_dimensions_required: 4
  review_threshold: 0.80
  ease_default: 2.5
  ease_min: 1.3
  first_intervals: [1, 6]
  max_interval_days: 180
