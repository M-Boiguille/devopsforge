name: generate-exercise

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Clone private profile repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/devopsforge-profile.git" /tmp/profile-repo

      - name: Generate exercise
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_BASE_URL: ${{ vars.AI_GATEWAY_BASE_URL }}
          PROJECT_STATE: ${{ vars.PROJECT_STATE }}
          PROFILE_REPO_PATH: /tmp/profile-repo
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re

          import requests
          import yaml

          repo = os.environ["GITHUB_WORKSPACE"]
          profile_repo = os.environ["PROFILE_REPO_PATH"]

          def read(rel, base=repo):
              with open(os.path.join(base, rel), encoding="utf-8") as fh:
                  return fh.read()

          def load_yaml(path):
              with open(path, encoding="utf-8") as fh:
                  return yaml.safe_load(fh) or {}

          agent = load_yaml(os.path.join(repo, "config/agent.yaml"))
          model = agent["models"]["exercise_generation"]["model"]

          profiles = {}
          for path in sorted(glob.glob(os.path.join(profile_repo, "profile", "*.yaml"))):
              profiles[os.path.basename(path)] = load_yaml(path)

          dues = load_yaml(os.path.join(profile_repo, "dues.yaml"))
          roadmap = load_yaml(os.path.join(profile_repo, "roadmap.yaml"))

          # Notion principale : première notion due, sinon première notion du profil.
          priority_order = {"high": 0, "medium": 1, "low": 2}
          due_list = sorted(
              dues.get("dues", []) or [],
              key=lambda d: (priority_order.get(d.get("priority", "low"), 2), d.get("due_since", "")),
          )
          primary = due_list[0]["notion"] if due_list else None
          if not primary:
              for fname in sorted(profiles):
                  notions = profiles[fname].get("notions", {}) or {}
                  if notions:
                      primary = sorted(notions)[0]
                      break
          primary = primary or "exercice"

          # Numéro séquentiel sur 3 chiffres.
          exercises_dir = os.path.join(repo, "exercises")
          os.makedirs(exercises_dir, exist_ok=True)
          max_n = 0
          for name in os.listdir(exercises_dir):
              m = re.match(r"^(\d{3})-", name)
              if m:
                  max_n = max(max_n, int(m.group(1)))
          dir_name = f"{max_n + 1:03d}-{primary}"
          out_dir = os.path.join(exercises_dir, dir_name)
          os.makedirs(out_dir, exist_ok=True)

          exercises = sorted(glob.glob(os.path.join(repo, "exercises", "*", "exercise.md")))
          last_exercise = read(os.path.relpath(exercises[-1], repo)) if exercises else "(aucun)"

          template = read(".github/prompts/generate-exercise.md")
          project_state = os.environ.get("PROJECT_STATE") or "(non renseigné au MVP)"

          user_prompt = (
              template
              .replace("{profile}", yaml.safe_dump(profiles, allow_unicode=True, sort_keys=False))
              .replace("{dues}", yaml.safe_dump(dues, allow_unicode=True, sort_keys=False))
              .replace("{last_exercise}", last_exercise)
              .replace("{project_state}", project_state)
              .replace("{roadmap}", yaml.safe_dump(roadmap, allow_unicode=True, sort_keys=False))
          )

          base_url = (os.environ.get("AI_GATEWAY_BASE_URL") or "https://api.deepseek.com/v1").rstrip("/")
          api_key = os.environ["AI_GATEWAY_API_KEY"]

          resp = requests.post(
              f"{base_url}/chat/completions",
              headers={"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"},
              json={
                  "model": model,
                  "messages": [
                      {"role": "system", "content": "Tu es un formateur DevOps exigeant mais bienveillant."},
                      {"role": "user", "content": user_prompt},
                  ],
                  "temperature": agent["models"]["exercise_generation"].get("temperature", 0.7),
              },
              timeout=120,
          )
          resp.raise_for_status()
          content = resp.json()["choices"][0]["message"]["content"]

          with open(os.path.join(out_dir, "exercise.md"), "w", encoding="utf-8") as fh:
              fh.write(content.rstrip() + "\n")

          # Scaffold par défaut : sous-dossier `code/` pour les fichiers de travail.
          code_dir = os.path.join(out_dir, "code")
          os.makedirs(code_dir, exist_ok=True)
          with open(os.path.join(code_dir, ".gitkeep"), "w", encoding="utf-8") as fh:
              pass

          print(f"::notice::Exercise written to exercises/{dir_name}/exercise.md")
          PY

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH="bot/exercise-$(date +%F)-run${{ github.run_number }}"
          git config user.name "devopsforge-bot"
          git config user.email "bot@devopsforge.local"
          git checkout -b "$BRANCH"
          git add exercises/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: generate exercise"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Exercice $(ls exercises/ | sort | tail -1)" \
            --body "Généré automatiquement par DevOpsForge. À résoudre dans \`exercises/$(ls exercises/ | sort | tail -1)/code/\` puis à soumettre via \`submission.md\` (auto-évaluation) dans le même dossier."
