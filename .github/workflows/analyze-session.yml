name: analyze-session

on:
  push:
    branches:
      - "**"
    paths:
      - "exercises/**/submission.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install linters
        run: |
          pip install flake8
          sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Lint (non-blocking)
        run: |
          DIR=$(find exercises -name 'submission.md' | sed -E 's#^(exercises/[0-9]{3}-[^/]+)/.*#\1#' | sort -u | tail -1)
          echo "Lint sur $DIR"
          find "$DIR" -name '*.sh' -print0 | xargs -0 -r shellcheck || true
          find "$DIR" -name '*.py' -print0 | xargs -0 -r flake8 --max-line-length=100 || true

  evaluate:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyyaml requests flake8
          sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Lint report
        run: |
          DIR=$(find exercises -name 'submission.md' | sed -E 's#^(exercises/[0-9]{3}-[^/]+)/.*#\1#' | sort -u | tail -1)
          echo "EXERCISE_DIR=$DIR" >> "$GITHUB_ENV"
          {
            echo "=== shellcheck ==="
            find "$DIR" -name '*.sh' -print0 | xargs -0 -r shellcheck || true
            echo "=== flake8 ==="
            find "$DIR" -name '*.py' -print0 | xargs -0 -r flake8 --max-line-length=100 || true
          } > /tmp/lint-report.txt || true
          echo "lint report captured for $DIR"

      - name: Evaluate submission
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_BASE_URL: ${{ vars.AI_GATEWAY_BASE_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import date
          from pathlib import Path

          import requests
          import yaml

          repo = os.environ["GITHUB_WORKSPACE"]
          dir_path = os.path.join(repo, os.environ["EXERCISE_DIR"])

          def load(rel):
              with open(os.path.join(repo, rel), encoding="utf-8") as fh:
                  return yaml.safe_load(fh) or {}

          def read(path):
              try:
                  with open(path, encoding="utf-8") as fh:
                      return fh.read()
              except OSError:
                  return "(absent)"

          agent = load("config/agent.yaml")
          model = agent["models"]["evaluation"]["model"]
          thresholds = load("config/thresholds.yaml")
          patterns = thresholds.get("review", {}).get("flag_patterns", [])

          exercise_text = read(os.path.join(dir_path, "exercise.md"))
          submission_text = read(os.path.join(dir_path, "submission.md"))

          code_parts = []
          for root, dirs, files in os.walk(dir_path):
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              for f in sorted(files):
                  if f.endswith(".md"):
                      continue
                  p = os.path.join(root, f)
                  try:
                      content = read(p)
                  except OSError:
                      continue
                  code_parts.append(f"### {os.path.relpath(p, dir_path)}\n{content}")
          code_content = "\n\n".join(code_parts) or "(aucun fichier de code)"

          haystack = code_content + "\n" + submission_text
          detected = [pat for pat in patterns if re.search(pat, haystack, re.IGNORECASE)]
          lint_report = read("/tmp/lint-report.txt")

          weights = load("config/grading_weights.yaml")
          errors_log = read(os.path.join(repo, "errors.log"))

          template = read(os.path.join(repo, ".github/prompts/evaluate-submission.md"))
          user_prompt = (
              template
              .replace("{exercise}", exercise_text)
              .replace("{submission}", code_content)
              .replace("{self_evaluation}", submission_text)
              .replace("{grading_weights}", yaml.safe_dump(weights, allow_unicode=True, sort_keys=False))
              .replace("{errors_log}", errors_log)
              .replace("{anti_patterns_detected}", json.dumps(detected, ensure_ascii=False))
              .replace("{lint_report}", lint_report)
          )

          base_url = (os.environ.get("AI_GATEWAY_BASE_URL") or "https://api.deepseek.com/v1").rstrip("/")
          api_key = os.environ["AI_GATEWAY_API_KEY"]

          resp = requests.post(
              f"{base_url}/chat/completions",
              headers={"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"},
              json={
                  "model": model,
                  "messages": [
                      {"role": "system", "content": "Tu es un évaluateur DevOps exigeant (esprit école 42). Réponds en JSON strict uniquement."},
                      {"role": "user", "content": user_prompt},
                  ],
                  "temperature": agent["models"]["evaluation"].get("temperature", 0.2),
              },
              timeout=180,
          )
          resp.raise_for_status()
          content = resp.json()["choices"][0]["message"]["content"]

          def extract_json(text):
              m = re.search(r"```(?:json)?\s*(.*?)\s*```", text, re.DOTALL)
              if m:
                  return m.group(1)
              return text.strip()

          parsed = json.loads(extract_json(content))
          report = parsed.pop("report", "")
          parsed["date"] = date.today().isoformat()

          with open(os.path.join(dir_path, "analysis.md"), "w", encoding="utf-8") as fh:
              fh.write("---\n")
              yaml.safe_dump(parsed, fh, allow_unicode=True, sort_keys=False, default_flow_style=False)
              fh.write("---\n")
              fh.write(report.rstrip() + "\n")

          print(f"::notice::Analysis written to {os.environ['EXERCISE_DIR']}/analysis.md")
          PY

      - name: Commit analysis
        run: |
          git config user.name "devopsforge-bot"
          git config user.email "bot@devopsforge.local"
          git add exercises/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: analyze submission"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Notify on PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -z "$PR" ]; then
            echo "::warning::Aucune PR ouverte pour la branche $GITHUB_REF_NAME — pas de commentaire."
            exit 0
          fi
          gh pr comment "$PR" --body "Analyse terminée : voir \`exercises/*/analysis.md\`." || echo "::warning::commentaire impossible"
          gh pr review "$PR" --approve --body "Analyse automatique DevOpsForge terminée." || echo "::warning::approbation impossible (non bloquant)"
